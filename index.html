<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잘머거요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10,4 L17,4 A16,16 0 0 0 28,17 L28,22 A6,6 0 0 1 22,28 L10,28 A6,6 0 0 1 4,22 L4,10 A6,6 0 0 1 10,4 Z' fill='%231E1E1E'/%3E%3Ccircle cx='8' cy='8' r='1.5' fill='%23FFFFFF'/%3E%3Ccircle cx='8' cy='24' r='1.5' fill='%23FFFFFF'/%3E%3Ccircle cx='24' cy='24' r='1.5' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-title" content="잘머거요">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #1E1E1E;
    --ink-soft: #8A8A8A;
    --line: #EAEAEA;
    --accent: #1E1E1E;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 20px -14px rgba(0,0,0,0.12);
    font-family: "Inter", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --paper: #161616;
    --card: #1E1E1E;
    --ink: #F2F2F2;
    --ink-soft: #8F8F8F;
    --line: #303030;
    --accent: #F2F2F2;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    padding: 24px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  /* ---- top bar ---- */
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .topbar h1 {
    font-family: "Inter", "Noto Sans KR", sans-serif; font-weight: 600; font-size: 26px;
    margin: 0; letter-spacing: -0.01em;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-logo { width: 26px; height: 26px; flex-shrink: 0; }
  .date-input {
    font-family: "Inter", sans-serif; font-size: 14px; color: var(--ink-soft);
    background: transparent; border: none; border-bottom: 1px solid var(--line);
    padding: 4px 2px; cursor: pointer;
  }
  .date-input:focus { outline: none; border-color: var(--moss); }

  .mode-toggle {
    display: flex; gap: 6px; margin-bottom: 16px;
  }
  .mode-toggle button {
    flex: 1; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: background .15s, color .15s;
  }
  .mode-toggle button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ---- the report card (this is what gets exported) ---- */
  #report {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    overflow: hidden; border: 1px solid var(--line);
  }
  .report-head {
    padding: 14px 18px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .report-head .title { font-family: "Inter", "Noto Sans KR", sans-serif; font-weight: 600; font-size: 16px; }
  .report-head .sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
  .report-head .sub:empty::before { content: attr(data-placeholder); color: var(--ink-soft); }
  .report-head .sub:focus { outline: none; }
  .report-head .totals { text-align: right; font-size: 11px; color: var(--ink-soft); }
  .report-head .totals b { color: var(--ink); font-size: 13px; font-family: "Inter", "Noto Sans KR", sans-serif; }
  .totals-row { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
  .totals-logo { width: 13px; height: 13px; flex-shrink: 0; }

  #mealSections { display: grid; grid-template-columns: 1fr 1fr; }
  .meal-section { display: flex; flex-direction: column; }

  .quad-photos {
    flex: 1; padding: 0; display: flex; flex-wrap: wrap; gap: 2px;
    min-height: 150px;
  }
  .photo-cell { position: relative; overflow: hidden; background: var(--paper); flex: 1 1 45%; min-width: 70px; }
  .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-time {
    position: absolute; right: 5px; bottom: 5px; z-index: 1;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 10px; font-weight: 600;
    padding: 4px 6px 3px; border-radius: 6px; font-variant-numeric: tabular-nums;
    font-family: "Inter", "Noto Sans KR", sans-serif;
  }
  .add-tile-photo {
    border: none; border-radius: 0; background: none; flex: 1 1 45%; min-width: 70px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); cursor: pointer; font-family: inherit;
  }
  .add-tile-photo .plus { font-size: 26px; line-height: 1; font-weight: 300; }
  .add-tile-photo:hover { color: var(--moss); }
  .add-tile-photo.is-solo { flex: 1 1 100%; min-height: 150px; }

  .quad-caption {
    border-top: 1px solid var(--line); padding: 9px 14px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .quad-badge {
    flex-shrink: 0; width: 24px;
    font-family: "Inter", "Noto Sans KR", sans-serif; font-weight: 700; font-size: 13px;
    color: var(--ink); line-height: 1.35;
  }
  .quad-lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .quad-line { display: flex; align-items: center; gap: 6px; line-height: 1.35; }
  .quad-line .q-time {
    font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--ink-soft);
    border: none; background: transparent; padding: 0; width: 62px; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .quad-line .q-note {
    flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.35; color: var(--ink);
    word-break: break-word;
  }
  .quad-line .q-note:empty::before { content: "메모 없음"; color: var(--ink-soft); font-style: italic; }
  .quad-line .q-note[contenteditable="true"]:focus { outline: none; background: var(--paper); border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
  .quad-line .q-del {
    border: none; background: none; color: var(--ink-soft); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 2px 4px; flex-shrink: 0; opacity: .55;
  }
  .quad-line .q-del:hover { opacity: 1; color: var(--clay); }
  .quad-empty-line { font-size: 12.5px; color: var(--ink-soft); font-style: italic; }

  body.preview-mode .add-tile-photo,
  body.preview-mode .q-del,
  body.preview-mode .date-input { display: none; }
  body.preview-mode .q-time { display: none; }
  body.preview-mode .q-note[contenteditable] { pointer-events: none; }
  body.preview-mode #dailyNote { pointer-events: none; }

  /* ---- action bar ---- */
  .actions {
    position: sticky; bottom: 16px; margin-top: 18px;
    display: flex; gap: 10px;
  }
  .btn-save {
    flex: 1; padding: 14px; border-radius: 14px; border: none;
    background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 700;
    font-family: "Inter", "Noto Sans KR", sans-serif; cursor: pointer; box-shadow: var(--shadow);
  }
  .btn-save:active { transform: scale(0.99); }

  .slot-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .slot-chip {
    padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .slot-chip:hover { border-color: var(--moss); color: var(--moss); }
  body.preview-mode .slot-chips { display: none; }

  .quad-remove {
    border: none; background: none; color: var(--ink-soft); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 2px 4px; opacity: .5; margin-left: auto;
    flex-shrink: 0; font-family: inherit;
  }
  .quad-remove:hover { opacity: 1; color: var(--clay); }
  body.preview-mode .quad-remove { display: none; }

  /* ---- photo source action sheet ---- */
  .photo-sheet {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: flex-end; justify-content: center;
  }
  .photo-sheet-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.4);
  }
  .photo-sheet-panel {
    position: relative; width: 100%; max-width: 420px; margin: 0 12px 12px;
    background: var(--card); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .photo-sheet-panel button {
    display: block; width: 100%; padding: 15px; border: none; background: none;
    font-family: "Inter", "Noto Sans KR", sans-serif; font-size: 15px; font-weight: 600;
    color: var(--ink); cursor: pointer; border-bottom: 1px solid var(--line);
  }
  .photo-sheet-panel button:last-child { border-bottom: none; color: var(--ink-soft); font-weight: 500; }
  .photo-sheet-panel button:active { background: var(--paper); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10,4 L17,4 A16,16 0 0 0 28,17 L28,22 A6,6 0 0 1 22,28 L10,28 A6,6 0 0 1 4,22 L4,10 A6,6 0 0 1 10,4 Z" fill="#1E1E1E"/>
        <circle cx="8" cy="8" r="1.5" fill="#FFFFFF"/>
        <circle cx="8" cy="24" r="1.5" fill="#FFFFFF"/>
        <circle cx="24" cy="24" r="1.5" fill="#FFFFFF"/>
      </svg>
      <h1>잘머거요</h1>
    </div>
    <input type="date" class="date-input" id="dateInput">
  </div>

  <div class="mode-toggle">
    <button id="editBtn" class="active" onclick="setMode('edit')">편집</button>
    <button id="previewBtn" onclick="setMode('preview')">미리보기</button>
  </div>

  <div id="report">
    <div class="report-head">
      <div>
        <div class="title" id="reportDateLabel">9월 17일 (목)</div>
        <div class="sub" id="dailyNote" contenteditable="true" data-placeholder="오늘 한마디를 남겨보세요"></div>
      </div>
      <div class="totals">
        <div class="totals-row">
          <span>총 <b id="totalCount">0</b>끼</span>
          <svg class="totals-logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M10,4 L17,4 A16,16 0 0 0 28,17 L28,22 A6,6 0 0 1 22,28 L10,28 A6,6 0 0 1 4,22 L4,10 A6,6 0 0 1 10,4 Z" fill="#1E1E1E"/>
            <circle cx="8" cy="8" r="1.5" fill="#FFFFFF"/>
            <circle cx="8" cy="24" r="1.5" fill="#FFFFFF"/>
            <circle cx="24" cy="24" r="1.5" fill="#FFFFFF"/>
          </svg>
        </div>
      </div>

    <div id="mealSections"></div>
  </div>

  <div class="slot-chips" id="slotChips"></div>

  <div class="actions">
    <button class="btn-save" id="saveBtn" onclick="exportImage()">이미지로 저장</button>
  </div>
</div>

<div class="photo-sheet" id="photoSheet">
  <div class="photo-sheet-backdrop" onclick="closePhotoSheet()"></div>
  <div class="photo-sheet-panel">
    <button type="button" onclick="triggerCamera()">카메라로 촬영</button>
    <button type="button" onclick="triggerGallery()">갤러리에서 선택</button>
    <button type="button" onclick="closePhotoSheet()">취소</button>
  </div>
</div>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="galleryInput" accept="image/*" multiple style="display:none">

<script>
const MEALS = [
  { key: 'breakfast', label: 'B', name: '아침', repeatable: false },
  { key: 'lunch', label: 'L', name: '점심', repeatable: false },
  { key: 'dinner', label: 'D', name: '저녁', repeatable: false },
  { key: 'snack', label: 'S', name: '간식', repeatable: true },
];
function mealDef(key){ return MEALS.find(m => m.key === key); }

// slots: [{ id, key }]  — 각 슬롯이 화면의 칸 하나
// entriesBySlot[slotId] = [{ id, dataUrl, time: "HH:MM", note }]
let slots = [];
let entriesBySlot = {};
let idCounter = 0;
let slotIdCounter = 0;

function newSlotId(key){ return key + '_' + (++slotIdCounter); }

const STORAGE_PREFIX = 'zalmeogeoyo_v1_';
let currentDateStr = null;

function storageKey(dateStr){ return STORAGE_PREFIX + dateStr; }

function saveCurrentDay(){
  if(!currentDateStr) return;
  try{
    const note = document.getElementById('dailyNote').textContent;
    localStorage.setItem(storageKey(currentDateStr), JSON.stringify({
      slots, entriesBySlot, dailyNote: note
    }));
  }catch(e){
    alert('저장 공간이 가득 찼어요. 오래된 날짜의 사진을 좀 지워주세요.');
  }
}

function loadDay(dateStr){
  let data = null;
  try{
    const raw = localStorage.getItem(storageKey(dateStr));
    if(raw) data = JSON.parse(raw);
  }catch(e){ data = null; }

  slotIdCounter = 0;

  if(data && Array.isArray(data.slots) && data.entriesBySlot){
    slots = data.slots;
    entriesBySlot = data.entriesBySlot;
    slots.forEach(s => { if(!entriesBySlot[s.id]) entriesBySlot[s.id] = []; });
  } else if(data && Array.isArray(data.activeMeals)){
    // 이전 버전(타입별 activeMeals) 데이터를 슬롯 구조로 변환
    slots = []; entriesBySlot = {};
    data.activeMeals.forEach(key => {
      const id = newSlotId(key);
      slots.push({ id, key });
      entriesBySlot[id] = (data.entries && data.entries[key]) || [];
    });
  } else if(data && data.entries){
    // 더 이전 버전(슬롯 개념 자체가 없던 저장분): 전부 활성으로 간주
    slots = []; entriesBySlot = {};
    MEALS.forEach(m => {
      const id = newSlotId(m.key);
      slots.push({ id, key: m.key });
      entriesBySlot[id] = data.entries[m.key] || [];
    });
  } else {
    slots = []; entriesBySlot = {};
  }

  idCounter = 0;
  Object.values(entriesBySlot).forEach(list => list.forEach(en => { if(en.id > idCounter) idCounter = en.id; }));
  slots.forEach(s => {
    const m = /_(\d+)$/.exec(s.id);
    if(m){ const n = parseInt(m[1], 10); if(n > slotIdCounter) slotIdCounter = n; }
  });

  document.getElementById('dailyNote').textContent = (data && data.dailyNote) ? data.dailyNote : '';
}

function pad(n){ return String(n).padStart(2,'0'); }

function nowTimeStr(){
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function initDate(){
  const el = document.getElementById('dateInput');
  const d = new Date();
  el.value = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  currentDateStr = el.value;
  loadDay(currentDateStr);
  updateDateLabel();
  el.addEventListener('change', () => {
    saveCurrentDay();
    currentDateStr = el.value;
    loadDay(currentDateStr);
    updateDateLabel();
    render();
  });
}

function updateDateLabel(){
  const val = document.getElementById('dateInput').value;
  if(!val) return;
  const [y,m,d] = val.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('reportDateLabel').textContent =
    `${m}월 ${d}일 (${days[dt.getDay()]})`;
}

function setMode(mode){
  document.body.classList.toggle('preview-mode', mode === 'preview');
  document.getElementById('editBtn').classList.toggle('active', mode === 'edit');
  document.getElementById('previewBtn').classList.toggle('active', mode === 'preview');

  const note = document.getElementById('dailyNote');
  if(mode === 'preview'){
    const hasText = note.textContent.trim().length > 0;
    note.style.display = hasText ? '' : 'none';
  } else {
    note.style.display = '';
  }
}

function extractExifTime(file, cb){
  try{
    EXIF.getData(file, function(){
      const raw = EXIF.getTag(this, 'DateTimeOriginal');
      if(raw){
        // format: "YYYY:MM:DD HH:MM:SS"
        const parts = raw.split(' ')[1];
        if(parts){
          const [h,mi] = parts.split(':');
          cb(h + ':' + mi);
          return;
        }
      }
      cb(null);
    });
  }catch(e){ cb(null); }
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if(height >= width && height > maxDim){
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function handleFiles(slotId, fileList){
  Array.from(fileList).forEach(file => {
    compressImage(file, 800, 0.72).then((dataUrl) => {
      if(!dataUrl) return;
      const entry = { id: ++idCounter, dataUrl, time: nowTimeStr(), note: '' };
      entriesBySlot[slotId].push(entry);
      render();
      saveCurrentDay();
      extractExifTime(file, (t) => {
        if(t){
          entry.time = t;
          render();
          saveCurrentDay();
        }
      });
    });
  });
}

function removeEntry(slotId, id){
  entriesBySlot[slotId] = entriesBySlot[slotId].filter(e => e.id !== id);
  render();
  saveCurrentDay();
}

function updateTime(slotId, id, val){
  const e = entriesBySlot[slotId].find(e => e.id === id);
  if(e) e.time = val;
  saveCurrentDay();
}

function updateNote(slotId, id, val){
  const e = entriesBySlot[slotId].find(e => e.id === id);
  if(e) e.note = val;
  saveCurrentDay();
}

function addSlot(key){
  const meal = mealDef(key);
  if(!meal.repeatable && slots.some(s => s.key === key)) return;
  const id = newSlotId(key);
  slots.push({ id, key });
  entriesBySlot[id] = [];
  render();
  saveCurrentDay();
}

function removeSlot(slotId){
  const hasPhotos = (entriesBySlot[slotId] || []).length > 0;
  if(hasPhotos && !confirm('이 칸의 사진과 메모가 모두 삭제돼요. 계속할까요?')) return;
  slots = slots.filter(s => s.id !== slotId);
  delete entriesBySlot[slotId];
  render();
  saveCurrentDay();
}

function render(){
  const container = document.getElementById('mealSections');
  container.innerHTML = '';

  const totalRows = Math.ceil(slots.length / 2);
  let total = 0;

  const countByType = {};
  slots.forEach(s => { countByType[s.key] = (countByType[s.key] || 0) + 1; });
  const seenIndex = {};

  slots.forEach((slot, i) => {
    const meal = mealDef(slot.key);
    const list = (entriesBySlot[slot.id] || []).slice().sort((a,b) => a.time.localeCompare(b.time));
    total += list.length;
    seenIndex[slot.key] = (seenIndex[slot.key] || 0) + 1;
    const badgeLabel = countByType[slot.key] > 1 ? meal.label + seenIndex[slot.key] : meal.label;

    const isLastOdd = (slots.length % 2 === 1) && (i === slots.length - 1);
    const col = i % 2;
    const row = Math.floor(i / 2);
    const isLastRow = row === totalRows - 1;

    const section = document.createElement('div');
    section.className = 'meal-section m-' + slot.key;
    if(isLastOdd) section.style.gridColumn = '1 / -1';
    if(!isLastOdd && col === 0 && (i + 1) < slots.length) section.style.borderRight = '1px solid var(--line)';
    if(!isLastRow) section.style.borderBottom = '1px solid var(--line)';

    // photo area
    const photos = document.createElement('div');
    photos.className = 'quad-photos';

    list.forEach(entry => {
      const cell = document.createElement('div');
      cell.className = 'photo-cell';
      const img = document.createElement('img');
      img.src = entry.dataUrl;
      img.alt = badgeLabel + ' 사진';
      cell.appendChild(img);
      const timeTag = document.createElement('span');
      timeTag.className = 'photo-time';
      timeTag.textContent = entry.time;
      cell.appendChild(timeTag);
      photos.appendChild(cell);
    });

    const addTile = document.createElement('button');
    addTile.type = 'button';
    addTile.className = 'add-tile-photo' + (list.length === 0 ? ' is-solo' : '');
    addTile.innerHTML = `<span class="plus">+</span>`;
    addTile.addEventListener('click', () => openPhotoSheet(slot.id));
    photos.appendChild(addTile);

    section.appendChild(photos);

    // caption strip: badge + one line per entry
    const caption = document.createElement('div');
    caption.className = 'quad-caption';

    const badge = document.createElement('span');
    badge.className = 'quad-badge';
    badge.textContent = badgeLabel;
    caption.appendChild(badge);

    const lines = document.createElement('div');
    lines.className = 'quad-lines';

    if(list.length === 0){
      const emptyLine = document.createElement('div');
      emptyLine.className = 'quad-empty-line';
      emptyLine.textContent = '기록 없음';
      lines.appendChild(emptyLine);
    } else {
      list.forEach(entry => {
        const line = document.createElement('div');
        line.className = 'quad-line';
        line.innerHTML = `
          <input type="time" class="q-time" value="${entry.time}">
          <span class="q-note" contenteditable="true" data-placeholder="메모 추가"></span>
          <button class="q-del" title="삭제">✕</button>
        `;
        const timeInput = line.querySelector('.q-time');
        timeInput.addEventListener('change', (ev) => { updateTime(slot.id, entry.id, ev.target.value); render(); });
        line.querySelector('.q-del').addEventListener('click', () => removeEntry(slot.id, entry.id));
        const noteEl = line.querySelector('.q-note');
        noteEl.textContent = entry.note;
        noteEl.addEventListener('input', (ev) => updateNote(slot.id, entry.id, ev.target.textContent));
        lines.appendChild(line);
      });
    }
    caption.appendChild(lines);

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'quad-remove';
    removeBtn.title = '슬롯 제거';
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', () => removeSlot(slot.id));
    caption.appendChild(removeBtn);

    section.appendChild(caption);

    container.appendChild(section);
  });

  document.getElementById('totalCount').textContent = total;
  renderSlotChips();
}

function renderSlotChips(){
  const chipRow = document.getElementById('slotChips');
  chipRow.innerHTML = '';
  MEALS.forEach(meal => {
    const exists = slots.some(s => s.key === meal.key);
    if(exists && !meal.repeatable) return;
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'slot-chip';
    chip.textContent = exists ? `+ ${meal.name} 추가` : `+ ${meal.name}`;
    chip.addEventListener('click', () => addSlot(meal.key));
    chipRow.appendChild(chip);
  });
}

async function exportImage(){
  const wasPreview = document.body.classList.contains('preview-mode');
  setMode('preview');
  const btn = document.getElementById('saveBtn');
  const original = btn.textContent;
  btn.textContent = '저장 중...';
  btn.disabled = true;
  try{
    const target = document.getElementById('report');
    const canvas = await html2canvas(target, {
      backgroundColor: getComputedStyle(document.body).backgroundColor,
      scale: 2,
      useCORS: true,
    });
    const link = document.createElement('a');
    const dateVal = document.getElementById('dateInput').value || 'meal-log';
    link.download = `식단_${dateVal}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(err){
    alert('이미지 저장에 실패했어요: ' + err.message);
  }finally{
    btn.textContent = original;
    btn.disabled = false;
    if(!wasPreview) setMode('edit');
  }
}

let pendingSlotId = null;

function openPhotoSheet(slotId){
  pendingSlotId = slotId;
  document.getElementById('photoSheet').style.display = 'flex';
}
function closePhotoSheet(){
  document.getElementById('photoSheet').style.display = 'none';
}
function triggerCamera(){ document.getElementById('cameraInput').click(); }
function triggerGallery(){ document.getElementById('galleryInput').click(); }

document.getElementById('cameraInput').addEventListener('change', (ev) => {
  if(pendingSlotId) handleFiles(pendingSlotId, ev.target.files);
  ev.target.value = '';
  closePhotoSheet();
});
document.getElementById('galleryInput').addEventListener('change', (ev) => {
  if(pendingSlotId) handleFiles(pendingSlotId, ev.target.files);
  ev.target.value = '';
  closePhotoSheet();
});

initDate();
render();
document.getElementById('dailyNote').addEventListener('input', saveCurrentDay);
