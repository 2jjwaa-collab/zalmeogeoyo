<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잘머거요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10,4 L17,4 A16,16 0 0 0 28,17 L28,22 A6,6 0 0 1 22,28 L10,28 A6,6 0 0 1 4,22 L4,10 A6,6 0 0 1 10,4 Z' fill='%231E1E1E'/%3E%3Ccircle cx='8' cy='8' r='1.5' fill='%23FFFFFF'/%3E%3Ccircle cx='8' cy='24' r='1.5' fill='%23FFFFFF'/%3E%3Ccircle cx='24' cy='24' r='1.5' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1E1E1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="잘머거요">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #1E1E1E;
    --ink-soft: #8A8A8A;
    --line: #EAEAEA;
    --accent: #1E1E1E;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 20px -14px rgba(0,0,0,0.12);
    font-family: "Inter", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --paper: #161616;
    --card: #1E1E1E;
    --ink: #F2F2F2;
    --ink-soft: #8F8F8F;
    --line: #303030;
    --accent: #F2F2F2;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    padding: 24px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  /* ---- top bar ---- */
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .topbar h1 {
    font-family: "Inter", "Noto Sans KR", sans-serif; font-weight: 600; font-size: 26px;
    margin: 0; letter-spacing: -0.01em;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-logo { width: 26px; height: 26px; flex-shrink: 0; }
  .date-input {
    font-family: "Inter", sans-serif; font-size: 14px; color: var(--ink-soft);
    background: transparent; border: none; border-bottom: 1px solid var(--line);
    padding: 4px 2px; cursor: pointer; appearance: none;
  }
  .date-input:focus { outline: none; border-color: var(--moss); }

  .mode-toggle {
    display: flex; gap: 6px; margin-bottom: 16px;
  }
  .mode-toggle button {
    flex: 1; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: background .15s, color .15s;
  }
  .mode-toggle button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ---- the report card (this is what gets exported) ---- */
  #report {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    overflow: hidden; border: 1px solid var(--line);
  }
  .report-head {
    padding: 14px 18px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .report-head .title { font-family: "Inter", "Noto Sans KR", sans-serif; font-weight: 600; font-size: 16px; }
  .report-head .sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
  .report-head .sub:empty::before { content: attr(data-placeholder); color: var(--ink-soft); }
  .report-head .sub:focus { outline: none; }
  .report-head .totals { text-align: right; font-size: 11px; color: var(--ink-soft); }
  .report-head .totals b { color: var(--ink); font-size: 13px; font-family: "Inter", "Noto Sans KR", sans-serif; }
  .totals-row { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
  .totals-logo { width: 13px; height: 13px; flex-shrink: 0; }

  #mealSections { display: grid; grid-template-columns: 1fr 1fr; }
  .meal-section { display: flex; flex-direction: column; }

  .quad-photos {
    flex: 1; padding: 0; display: flex; flex-wrap: wrap; gap: 2px;
    min-height: 150px;
  }
  .photo-cell, .text-cell { position: relative; overflow: hidden; background: var(--paper); flex: 1 1 45%; min-width: 70px; aspect-ratio: 1 / 1; }
  .photo-cell img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    touch-action: none; -webkit-user-drag: none; user-select: none;
  }
  body:not(.preview-mode) .photo-cell img { cursor: grab; }
  body:not(.preview-mode) .photo-cell img:active { cursor: grabbing; }

  body[data-layout="portrait"] .photo-cell, body[data-layout="portrait"] .text-cell { aspect-ratio: 3 / 4; }
  body[data-layout="wide"] .photo-cell, body[data-layout="wide"] .text-cell { aspect-ratio: 9 / 16; }

  #mergedView { display: none; }
  body[data-layout="strip"].preview-mode #mealSections,
  body[data-layout="fourcut"].preview-mode #mealSections { display: none; }
  body[data-layout="strip"].preview-mode #mergedView {
    display: flex; flex-direction: row; flex-wrap: nowrap; gap: 2px;
  }
  body[data-layout="fourcut"].preview-mode #mergedView {
    display: flex; flex-direction: column; gap: 2px;
  }
  .merged-item { display: flex; flex-direction: column; }
  body[data-layout="strip"] .merged-item { flex: 1 1 0; min-width: 0; }
  body[data-layout="fourcut"] .merged-item { width: 100%; }
  .merged-photo { position: relative; overflow: hidden; background: var(--paper); }
  body[data-layout="strip"] .merged-photo { aspect-ratio: 3 / 4; }
  body[data-layout="fourcut"] .merged-photo { aspect-ratio: 4 / 3; }
  .merged-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .merged-photo-text {
    display: flex; align-items: center; justify-content: center; padding: 8px;
    border: 1px solid var(--line);
  }
  .merged-photo-note { font-size: 12px; text-align: center; color: var(--ink); word-break: break-word; }
  .merged-caption {
    border-top: 1px solid var(--line); padding: 9px 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .merged-note { font-size: 11px; line-height: 1.35; color: var(--ink); word-break: break-word; }
  .merged-empty {
    width: 100%; background: var(--paper); color: var(--ink-soft); font-style: italic;
    text-align: center; padding: 30px 10px;
  }

  .photo-time {
    appearance: none; -webkit-appearance: none; margin: 0; box-sizing: border-box;
    position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); z-index: 1;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 10px; font-weight: 600;
    padding: 5px 7px; border-radius: 6px; font-variant-numeric: tabular-nums;
    font-family: "Inter", "Noto Sans KR", sans-serif;
    border: none; cursor: pointer;
  }
  body.preview-mode .photo-time { pointer-events: none; }

  .text-cell {
    display: flex; align-items: center; justify-content: center; padding: 10px;
    border: 1px solid var(--line);
  }
  .text-cell-note {
    display: block; width: 100%; min-height: 1.4em;
    text-align: center; font-size: 13px; line-height: 1.4; color: var(--ink);
    word-break: break-word; outline: none;
  }
  .text-cell-note:empty::before { content: attr(data-placeholder); color: var(--ink-soft); font-style: italic; }
  body.preview-mode .text-cell-note:empty::before { content: none; }
  .text-cell-note:focus { background: var(--card); border-radius: 6px; }

  .tile-delete {
    position: absolute; top: 4px; right: 4px; z-index: 1;
    width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 11px; line-height: 1; padding: 0;
  }
  .tile-delete-text { background: var(--line); color: var(--ink-soft); }
  .tile-rotate {
    position: absolute; top: 4px; left: 4px; z-index: 1;
    width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 11px; line-height: 1; padding: 0;
  }
  body.preview-mode .tile-delete,
  body.preview-mode .tile-rotate { display: none; }

  .layout-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .layout-chip {
    padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .layout-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  body.preview-mode .layout-chips { display: none; }

  .add-tile-wrap {
    flex: 0 0 40px; display: flex; flex-direction: column;
  }
  .add-tile-wrap.is-solo { flex: 1 1 100%; min-height: 150px; }
  .add-photo-btn {
    border: none; background: none; color: var(--ink-soft); cursor: pointer;
    font-family: inherit; display: flex; align-items: center; justify-content: center;
    flex: 1 1 auto; width: 100%;
  }
  .add-photo-btn:hover { color: var(--moss); }
  .add-tile-wrap:not(.is-solo) .add-photo-btn .plus { font-size: 20px; line-height: 1; font-weight: 300; }
  .add-tile-wrap.is-solo .add-photo-btn .plus { font-size: 28px; line-height: 1; font-weight: 300; }

  .quad-caption {
    border-top: 1px solid var(--line); padding: 9px 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .quad-badge {
    flex-shrink: 0; width: 24px;
    font-family: "Inter", "Noto Sans KR", sans-serif; font-weight: 700; font-size: 13px;
    color: var(--ink); line-height: 1.35;
  }
  .quad-lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .quad-lines .q-note {
    display: block; width: 100%; font-size: 12.5px; line-height: 1.35; color: var(--ink);
    word-break: break-word; outline: none;
  }
  .quad-lines .q-note:empty::before { content: "메모 추가"; color: var(--ink-soft); font-style: italic; }
  body.preview-mode .quad-lines .q-note:empty::before { content: none; }
  .quad-lines .q-note:focus { background: var(--paper); border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }

  body.preview-mode .add-tile-wrap,
  body.preview-mode .date-input { display: none; }
  body.preview-mode .text-cell-note { pointer-events: none; }
  body.preview-mode .quad-lines .q-note { pointer-events: none; }
  body.preview-mode #dailyNote { pointer-events: none; }

  /* ---- action bar ---- */
  .actions {
    position: sticky; bottom: 16px; margin-top: 18px;
    display: flex; gap: 10px;
  }
  .btn-save {
    flex: 1; padding: 14px; border-radius: 14px; border: none;
    background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 700;
    font-family: "Inter", "Noto Sans KR", sans-serif; cursor: pointer; box-shadow: var(--shadow);
  }
  .btn-save:active { transform: scale(0.99); }

  .water-section { position: relative; border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .water-remove {
    position: absolute; top: 8px; right: 8px; z-index: 1;
    width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--line); color: var(--ink-soft); font-size: 10px; line-height: 1; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .water-remove:hover { background: var(--clay-soft, rgba(180,89,63,0.12)); color: var(--clay, #B4593F); }
  body.preview-mode .water-remove { display: none; }
  .water-label { display: flex; align-items: center; justify-content: flex-start; }
  .water-stepper { display: flex; align-items: center; gap: 10px; }
  .water-stepper button {
    border: none; background: var(--paper); color: var(--ink); width: 22px; height: 22px;
    border-radius: 50%; font-size: 12px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .water-stepper button:hover { background: var(--line); }
  .water-stepper .water-count {
    font-family: "Inter", "Noto Sans KR", sans-serif; font-weight: 700; font-size: 13px;
    color: var(--ink); min-width: 14px; text-align: center; font-variant-numeric: tabular-nums;
  }
  body.preview-mode .water-stepper button { display: none; }
  body.preview-mode .water-stepper .water-count { display: none; }
  .water-gauge { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 5px; }
  .water-cup {
    width: 14px; height: 17px; border: 1.5px solid var(--ink); border-radius: 0 0 4px 4px;
    background: var(--paper);
  }
  .water-cup.filled { background: linear-gradient(to top, var(--ink) 80%, var(--paper) 80%); }

  .slot-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .slot-chip {
    padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .slot-chip:hover { border-color: var(--moss); color: var(--moss); }
  body.preview-mode .slot-chips { display: none; }

  .quad-remove {
    border: none; background: var(--clay-soft, rgba(180,89,63,0.12)); color: var(--clay, #B4593F);
    cursor: pointer; font-size: 11px; font-weight: 700; line-height: 1;
    padding: 4px 8px; border-radius: 20px; opacity: .85; margin-left: auto;
    flex-shrink: 0; font-family: "Inter", "Noto Sans KR", sans-serif;
  }
  .quad-remove:hover { opacity: 1; }
  body.preview-mode .quad-remove { display: none; }

  /* ---- photo source action sheet ---- */
  .photo-sheet {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: flex-end; justify-content: center;
  }
  .photo-sheet-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.4);
  }
  .photo-sheet-panel {
    position: relative; width: 100%; max-width: 420px; margin: 0 12px 12px;
    background: var(--card); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .photo-sheet-panel button {
    display: block; width: 100%; padding: 15px; border: none; background: none;
    font-family: "Inter", "Noto Sans KR", sans-serif; font-size: 15px; font-weight: 600;
    color: var(--ink); cursor: pointer; border-bottom: 1px solid var(--line);
  }
  .photo-sheet-panel button:last-child { border-bottom: none; color: var(--ink-soft); font-weight: 500; }
  .photo-sheet-panel button:active { background: var(--paper); }
  .confirm-text {
    padding: 18px 18px 6px; font-family: "Inter", "Noto Sans KR", sans-serif;
    font-size: 13.5px; line-height: 1.5; color: var(--ink); text-align: center;
  }

  /* ---- custom date picker ---- */
  .date-popup {
    position: fixed; inset: 0; z-index: 55; display: none;
    align-items: center; justify-content: center;
  }
  .date-popup-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
  .date-popup-panel {
    position: relative; width: 300px; max-width: calc(100% - 32px);
    background: var(--card); border-radius: 16px; padding: 16px;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; font-family: "Inter", "Noto Sans KR", sans-serif;
    font-weight: 700; font-size: 14px; color: var(--ink);
  }
  .cal-header button {
    border: none; background: none; font-size: 18px; color: var(--ink-soft);
    cursor: pointer; padding: 4px 12px; font-family: inherit;
  }
  .cal-header button:hover { color: var(--ink); }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: 11px; color: var(--ink-soft); margin-bottom: 4px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-cell {
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    font-size: 13px; border-radius: 8px; cursor: pointer; color: var(--ink);
    background: none; border: none; font-family: "Inter", "Noto Sans KR", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .cal-cell.other-month { visibility: hidden; cursor: default; }
  .cal-cell:not(.other-month):hover { background: var(--paper); }
  .cal-cell.selected { background: var(--ink); color: var(--paper); font-weight: 700; }
  .cal-cell.today:not(.selected) { border: 1px solid var(--ink); }

  /* ---- custom time picker ---- */
  .time-sheet {
    position: fixed; inset: 0; z-index: 55; display: none;
    align-items: flex-end; justify-content: center;
  }
  .time-sheet-panel {
    position: relative; width: 100%; max-width: 420px; margin: 0 12px 12px;
    background: var(--card); border-radius: 16px; padding: 20px;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .time-steppers { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px; }
  .stepper { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .stepper button {
    border: none; background: var(--paper); color: var(--ink); width: 44px; height: 32px;
    border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .stepper button:hover { background: var(--line); }
  .stepper-value {
    font-family: "Inter", "Noto Sans KR", sans-serif; font-size: 28px; font-weight: 700;
    font-variant-numeric: tabular-nums; width: 56px; text-align: center; color: var(--ink);
  }
  .stepper-colon { font-size: 26px; font-weight: 700; color: var(--ink-soft); padding-bottom: 22px; }
  .time-confirm {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: "Inter", "Noto Sans KR", sans-serif;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10,4 L17,4 A16,16 0 0 0 28,17 L28,22 A6,6 0 0 1 22,28 L10,28 A6,6 0 0 1 4,22 L4,10 A6,6 0 0 1 10,4 Z" fill="#1E1E1E"/>
        <circle cx="8" cy="8" r="1.5" fill="#FFFFFF"/>
        <circle cx="8" cy="24" r="1.5" fill="#FFFFFF"/>
        <circle cx="24" cy="24" r="1.5" fill="#FFFFFF"/>
      </svg>
      <h1>잘머거요</h1>
    </div>
    <button type="button" class="date-input" id="dateBtn"></button>
  </div>

  <div class="mode-toggle">
    <button id="editBtn" class="active" onclick="setMode('edit')">편집</button>
    <button id="previewBtn" onclick="setMode('preview')">미리보기</button>
  </div>

  <div class="layout-chips" id="layoutChips">
    <button type="button" class="layout-chip" data-layout="square">1:1</button>
    <button type="button" class="layout-chip" data-layout="portrait">3:4</button>
    <button type="button" class="layout-chip" data-layout="wide">16:9</button>
    <button type="button" class="layout-chip" data-layout="strip">strip</button>
    <button type="button" class="layout-chip" data-layout="fourcut">4cut</button>
  </div>

  <div id="report">
    <div class="report-head">
      <div>
        <div class="title" id="reportDateLabel">9월 17일 (목)</div>
        <div class="sub" id="dailyNote" contenteditable="true" data-placeholder="오늘 한마디를 남겨보세요"></div>
      </div>
      <div class="totals">
        <div class="totals-row">
          <span>총 <b id="totalCount">0</b>끼</span>
          <svg class="totals-logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M10,4 L17,4 A16,16 0 0 0 28,17 L28,22 A6,6 0 0 1 22,28 L10,28 A6,6 0 0 1 4,22 L4,10 A6,6 0 0 1 10,4 Z" fill="#1E1E1E"/>
            <circle cx="8" cy="8" r="1.5" fill="#FFFFFF"/>
            <circle cx="8" cy="24" r="1.5" fill="#FFFFFF"/>
            <circle cx="24" cy="24" r="1.5" fill="#FFFFFF"/>
          </svg>
        </div>
      </div>
    </div>
    <div id="mealSections"></div>
    <div id="mergedView"></div>

    <div class="water-section" id="waterSection">
      <button type="button" class="water-remove" onclick="setWaterEnabled(false)" title="물 표시 끄기">✕</button>
      <div class="water-gauge" id="waterGauge"></div>
      <div class="water-label">
        <div class="water-stepper">
          <button type="button" onclick="adjustWater(-1)">－</button>
          <span class="water-count" id="waterCount">0</span>
          <button type="button" onclick="adjustWater(1)">＋</button>
        </div>
      </div>
    </div>
  </div>

  <div class="slot-chips" id="slotChips"></div>

  <div class="actions">
    <button class="btn-save" id="saveBtn" onclick="exportImage()">이미지로 저장</button>
  </div>
</div>

<script>
const MEALS = [
  { key: 'breakfast', label: 'B', name: '아침', repeatable: false },
  { key: 'lunch', label: 'L', name: '점심', repeatable: false },
  { key: 'dinner', label: 'D', name: '저녁', repeatable: false },
  { key: 'snack', label: 'S', name: '간식', repeatable: true },
];
function mealDef(key){ return MEALS.find(m => m.key === key); }

// slots: [{ id, key }]  — 각 슬롯이 화면의 칸 하나
// entriesBySlot[slotId] = [{ id, dataUrl, time: "HH:MM", note }]
let slots = [];
let entriesBySlot = {};
let idCounter = 0;
let slotIdCounter = 0;
let waterCups = 0;
const WATER_GOAL = 8;
let waterEnabled = localStorage.getItem('zalmeogeoyo_water_enabled_v1') !== 'false';

function setWaterEnabled(val){
  waterEnabled = val;
  localStorage.setItem('zalmeogeoyo_water_enabled_v1', val ? 'true' : 'false');
  applyWaterVisibility();
  renderSlotChips();
}
function applyWaterVisibility(){
  const section = document.getElementById('waterSection');
  if(section) section.style.display = waterEnabled ? '' : 'none';
}

function adjustWater(delta){
  waterCups = Math.max(0, Math.min(20, waterCups + delta));
  renderWaterGauge();
  saveCurrentDay();
}
function renderWaterGauge(){
  const countEl = document.getElementById('waterCount');
  if(countEl) countEl.textContent = waterCups;
  const gauge = document.getElementById('waterGauge');
  if(!gauge) return;
  gauge.innerHTML = '';
  const total = Math.max(WATER_GOAL, waterCups);
  for(let i = 0; i < total; i++){
    const cup = document.createElement('span');
    cup.className = 'water-cup' + (i < waterCups ? ' filled' : '');
    gauge.appendChild(cup);
  }
}

function newSlotId(key){ return key + '_' + (++slotIdCounter); }

const STORAGE_PREFIX = 'zalmeogeoyo_v1_';
let currentDateStr = null;

function storageKey(dateStr){ return STORAGE_PREFIX + dateStr; }

function saveCurrentDay(){
  if(!currentDateStr) return;
  try{
    const note = document.getElementById('dailyNote').textContent;
    localStorage.setItem(storageKey(currentDateStr), JSON.stringify({
      slots, entriesBySlot, dailyNote: note, waterCups
    }));
  }catch(e){
    alert('저장 공간이 가득 찼어요. 오래된 날짜의 사진을 좀 지워주세요.');
  }
}

function loadDay(dateStr){
  let data = null;
  try{
    const raw = localStorage.getItem(storageKey(dateStr));
    if(raw) data = JSON.parse(raw);
  }catch(e){ data = null; }

  slotIdCounter = 0;

  if(data && Array.isArray(data.slots) && data.entriesBySlot){
    slots = data.slots;
    entriesBySlot = data.entriesBySlot;
    slots.forEach(s => { if(!entriesBySlot[s.id]) entriesBySlot[s.id] = []; });
  } else if(data && Array.isArray(data.activeMeals)){
    // 이전 버전(타입별 activeMeals) 데이터를 슬롯 구조로 변환
    slots = []; entriesBySlot = {};
    data.activeMeals.forEach(key => {
      const id = newSlotId(key);
      slots.push({ id, key });
      entriesBySlot[id] = (data.entries && data.entries[key]) || [];
    });
  } else if(data && data.entries){
    // 더 이전 버전(슬롯 개념 자체가 없던 저장분): 전부 활성으로 간주
    slots = []; entriesBySlot = {};
    MEALS.forEach(m => {
      const id = newSlotId(m.key);
      slots.push({ id, key: m.key });
      entriesBySlot[id] = data.entries[m.key] || [];
    });
  } else {
    slots = []; entriesBySlot = {};
  }

  idCounter = 0;
  Object.values(entriesBySlot).forEach(list => list.forEach(en => { if(en.id > idCounter) idCounter = en.id; }));
  slots.forEach(s => {
    const m = /_(\d+)$/.exec(s.id);
    if(m){ const n = parseInt(m[1], 10); if(n > slotIdCounter) slotIdCounter = n; }
  });

  document.getElementById('dailyNote').textContent = (data && data.dailyNote) ? data.dailyNote : '';
  waterCups = (data && typeof data.waterCups === 'number') ? data.waterCups : 0;
  renderWaterGauge();
}

function pad(n){ return String(n).padStart(2,'0'); }

function nowTimeStr(){
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function initDate(){
  const d = new Date();
  currentDateStr = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  loadDay(currentDateStr);
  updateDateLabel();
  document.getElementById('dateBtn').addEventListener('click', openDatePopup);
}

function updateDateLabel(){
  const [y,m,d] = currentDateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('reportDateLabel').textContent = `${m}월 ${d}일 (${days[dt.getDay()]})`;
  document.getElementById('dateBtn').textContent = `${y}. ${pad(m)}. ${pad(d)}.`;
}

let calViewYear = null, calViewMonth = null;

function openDatePopup(){
  const [y,m] = currentDateStr.split('-').map(Number);
  calViewYear = y; calViewMonth = m - 1;
  renderCalendar();
  document.getElementById('datePopup').style.display = 'flex';
}
function closeDatePopup(){
  document.getElementById('datePopup').style.display = 'none';
}
function calShiftMonth(delta){
  calViewMonth += delta;
  if(calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
  if(calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
  renderCalendar();
}
function renderCalendar(){
  document.getElementById('calMonthLabel').textContent = `${calViewYear}년 ${calViewMonth + 1}월`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
  const now = new Date();
  const todayStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());

  for(let i = 0; i < firstDay; i++){
    const filler = document.createElement('button');
    filler.type = 'button';
    filler.className = 'cal-cell other-month';
    grid.appendChild(filler);
  }
  for(let day = 1; day <= daysInMonth; day++){
    const dateStr = `${calViewYear}-${pad(calViewMonth + 1)}-${pad(day)}`;
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cal-cell'
      + (dateStr === currentDateStr ? ' selected' : '')
      + (dateStr === todayStr ? ' today' : '');
    cell.textContent = day;
    cell.addEventListener('click', () => selectDate(dateStr));
    grid.appendChild(cell);
  }
}
function selectDate(dateStr){
  saveCurrentDay();
  currentDateStr = dateStr;
  loadDay(currentDateStr);
  updateDateLabel();
  closeDatePopup();
  render();
}

function setMode(mode){
  document.body.classList.toggle('preview-mode', mode === 'preview');
  document.getElementById('editBtn').classList.toggle('active', mode === 'edit');
  document.getElementById('previewBtn').classList.toggle('active', mode === 'preview');

  const note = document.getElementById('dailyNote');
  if(mode === 'preview'){
    const hasText = note.textContent.trim().length > 0;
    note.style.display = hasText ? '' : 'none';
  } else {
    note.style.display = '';
  }
}

function extractExifTime(file, cb){
  try{
    EXIF.getData(file, function(){
      const raw = EXIF.getTag(this, 'DateTimeOriginal');
      if(raw){
        // format: "YYYY:MM:DD HH:MM:SS"
        const parts = raw.split(' ')[1];
        if(parts){
          const [h,mi] = parts.split(':');
          cb(h + ':' + mi);
          return;
        }
      }
      cb(null);
    });
  }catch(e){ cb(null); }
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if(height >= width && height > maxDim){
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function handleFiles(slotId, fileList){
  Array.from(fileList).forEach(file => {
    compressImage(file, 800, 0.72).then((dataUrl) => {
      if(!dataUrl) return;
      const entry = { id: ++idCounter, dataUrl, time: nowTimeStr(), note: '' };
      entriesBySlot[slotId].push(entry);
      render();
      saveCurrentDay();
      extractExifTime(file, (t) => {
        if(t){
          entry.time = t;
          render();
          saveCurrentDay();
        }
      });
    });
  });
}

function removeEntry(slotId, id){
  entriesBySlot[slotId] = entriesBySlot[slotId].filter(e => e.id !== id);
  render();
  saveCurrentDay();
}

function updateTime(slotId, id, val){
  const e = entriesBySlot[slotId].find(e => e.id === id);
  if(e) e.time = val;
  saveCurrentDay();
}

function updateNote(slotId, id, val){
  const e = entriesBySlot[slotId].find(e => e.id === id);
  if(e) e.note = val;
  saveCurrentDay();
}

function rotateEntry(slotId, id){
  const e = entriesBySlot[slotId].find(e => e.id === id);
  if(e) e.rotation = ((e.rotation || 0) + 90) % 360;
  render();
  saveCurrentDay();
}

let cropDrag = null;

function startCropDrag(ev, slotId, entryId, imgEl){
  if(document.body.classList.contains('preview-mode')) return;
  ev.preventDefault();
  const entry = entriesBySlot[slotId].find(e => e.id === entryId);
  if(!entry) return;
  const rect = imgEl.getBoundingClientRect();
  cropDrag = {
    slotId, entryId, imgEl,
    startX: ev.clientX, startY: ev.clientY,
    startCropX: entry.cropX ?? 50, startCropY: entry.cropY ?? 50,
    rectW: rect.width || 1, rectH: rect.height || 1,
    rotation: entry.rotation || 0,
    curX: entry.cropX ?? 50, curY: entry.cropY ?? 50,
    moved: false
  };
  window.addEventListener('pointermove', onCropDragMove);
  window.addEventListener('pointerup', endCropDrag);
  window.addEventListener('pointercancel', endCropDrag);
}
function onCropDragMove(ev){
  if(!cropDrag) return;
  cropDrag.moved = true;
  let dx = ev.clientX - cropDrag.startX;
  let dy = ev.clientY - cropDrag.startY;
  // 회전된 이미지는 드래그 방향도 같이 보정
  const rot = ((cropDrag.rotation % 360) + 360) % 360;
  if(rot === 90){ const t = dx; dx = -dy; dy = t; }
  else if(rot === 180){ dx = -dx; dy = -dy; }
  else if(rot === 270){ const t = dx; dx = dy; dy = -t; }
  let newX = cropDrag.startCropX - (dx / cropDrag.rectW) * 100;
  let newY = cropDrag.startCropY - (dy / cropDrag.rectH) * 100;
  newX = Math.max(0, Math.min(100, newX));
  newY = Math.max(0, Math.min(100, newY));
  cropDrag.imgEl.style.objectPosition = `${newX}% ${newY}%`;
  cropDrag.curX = newX;
  cropDrag.curY = newY;
}
function endCropDrag(ev){
  if(!cropDrag) return;
  const entry = entriesBySlot[cropDrag.slotId].find(e => e.id === cropDrag.entryId);
  if(entry && cropDrag.moved){
    entry.cropX = cropDrag.curX;
    entry.cropY = cropDrag.curY;
    saveCurrentDay();
  }
  window.removeEventListener('pointermove', onCropDragMove);
  window.removeEventListener('pointerup', endCropDrag);
  window.removeEventListener('pointercancel', endCropDrag);
  cropDrag = null;
}

let tileLayout = localStorage.getItem('zalmeogeoyo_layout_v1') || 'square';
if(tileLayout === 'stack') tileLayout = 'fourcut';

function setLayout(layout){
  tileLayout = layout;
  localStorage.setItem('zalmeogeoyo_layout_v1', layout);
  document.body.dataset.layout = layout;
  updateLayoutChipsUI();
}
function updateLayoutChipsUI(){
  document.querySelectorAll('.layout-chip').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layout === tileLayout);
  });
}

function addSlot(key){
  const meal = mealDef(key);
  if(!meal.repeatable && slots.some(s => s.key === key)) return;
  const id = newSlotId(key);
  slots.push({ id, key });
  entriesBySlot[id] = [];
  render();
  saveCurrentDay();
}

let pendingRemoveSlotId = null;

function removeSlot(slotId){
  const hasPhotos = (entriesBySlot[slotId] || []).length > 0;
  if(hasPhotos){
    pendingRemoveSlotId = slotId;
    document.getElementById('confirmSheet').style.display = 'flex';
    return;
  }
  doRemoveSlot(slotId);
}
function closeConfirmSheet(){
  document.getElementById('confirmSheet').style.display = 'none';
  pendingRemoveSlotId = null;
}
function confirmSlotRemove(){
  const id = pendingRemoveSlotId;
  closeConfirmSheet();
  if(id) doRemoveSlot(id);
}
function doRemoveSlot(slotId){
  slots = slots.filter(s => s.id !== slotId);
  delete entriesBySlot[slotId];
  render();
  saveCurrentDay();
}

function render(){
  const container = document.getElementById('mealSections');
  container.innerHTML = '';

  const totalRows = Math.ceil(slots.length / 2);
  let total = 0;

  const countByType = {};
  slots.forEach(s => { countByType[s.key] = (countByType[s.key] || 0) + 1; });
  const seenIndex = {};

  slots.forEach((slot, i) => {
    const meal = mealDef(slot.key);
    const list = (entriesBySlot[slot.id] || []).slice().sort((a,b) => a.time.localeCompare(b.time));
    total += list.length;
    seenIndex[slot.key] = (seenIndex[slot.key] || 0) + 1;
    const badgeLabel = countByType[slot.key] > 1 ? meal.label + seenIndex[slot.key] : meal.label;

    const isLastOdd = (slots.length % 2 === 1) && (i === slots.length - 1);
    const col = i % 2;
    const row = Math.floor(i / 2);
    const isLastRow = row === totalRows - 1;

    const section = document.createElement('div');
    section.className = 'meal-section m-' + slot.key;
    if(isLastOdd) section.style.gridColumn = '1 / -1';
    if(!isLastOdd && col === 0 && (i + 1) < slots.length) section.style.borderRight = '1px solid var(--line)';
    if(!isLastRow) section.style.borderBottom = '1px solid var(--line)';

    // photo/text tiles
    const photos = document.createElement('div');
    photos.className = 'quad-photos';

    list.forEach(entry => {
      if(entry.dataUrl){
        const cell = document.createElement('div');
        cell.className = 'photo-cell';
        cell.dataset.entryId = entry.id;

        const img = document.createElement('img');
        img.src = entry.dataUrl;
        img.alt = badgeLabel + ' 사진';
        img.draggable = false;
        img.style.transform = `rotate(${entry.rotation || 0}deg)`;
        img.style.objectPosition = `${entry.cropX ?? 50}% ${entry.cropY ?? 50}%`;
        img.addEventListener('pointerdown', (ev) => startCropDrag(ev, slot.id, entry.id, img));
        cell.appendChild(img);

        const timeTag = document.createElement('button');
        timeTag.type = 'button';
        timeTag.className = 'photo-time';
        timeTag.textContent = entry.time;
        timeTag.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openTimePicker(slot.id, entry.id, entry.time);
        });
        cell.appendChild(timeTag);

        const rotateBtn = document.createElement('button');
        rotateBtn.type = 'button';
        rotateBtn.className = 'tile-rotate';
        rotateBtn.title = '회전';
        rotateBtn.textContent = '⟳';
        rotateBtn.addEventListener('click', (ev) => { ev.stopPropagation(); rotateEntry(slot.id, entry.id); });
        cell.appendChild(rotateBtn);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'tile-delete';
        delBtn.title = '삭제';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', (ev) => { ev.stopPropagation(); removeEntry(slot.id, entry.id); });
        cell.appendChild(delBtn);

        photos.appendChild(cell);
      } else {
        const cell = document.createElement('div');
        cell.className = 'text-cell';
        cell.dataset.entryId = entry.id;

        const noteEl = document.createElement('span');
        noteEl.className = 'text-cell-note';
        noteEl.contentEditable = 'true';
        noteEl.setAttribute('data-placeholder', '내용 입력');
        noteEl.textContent = entry.note;
        noteEl.addEventListener('input', (ev) => updateNote(slot.id, entry.id, ev.target.textContent));
        cell.appendChild(noteEl);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'tile-delete tile-delete-text';
        delBtn.title = '삭제';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', (ev) => { ev.stopPropagation(); removeEntry(slot.id, entry.id); });
        cell.appendChild(delBtn);

        cell.addEventListener('click', (ev) => {
          if(ev.target === noteEl) return;
          noteEl.focus();
        });

        photos.appendChild(cell);
      }
    });

    const isSolo = list.length === 0;
    const addWrap = document.createElement('div');
    addWrap.className = 'add-tile-wrap' + (isSolo ? ' is-solo' : '');

    const addPhotoBtn = document.createElement('button');
    addPhotoBtn.type = 'button';
    addPhotoBtn.className = 'add-photo-btn';
    addPhotoBtn.title = '기록 추가';
    addPhotoBtn.innerHTML = `<span class="plus">+</span>`;
    addPhotoBtn.addEventListener('click', () => openAddChoiceSheet(slot.id));
    addWrap.appendChild(addPhotoBtn);

    photos.appendChild(addWrap);

    section.appendChild(photos);

    // caption strip: badge + memo per photo entry + whole-slot delete
    const caption = document.createElement('div');
    caption.className = 'quad-caption';

    const badge = document.createElement('span');
    badge.className = 'quad-badge';
    badge.textContent = badgeLabel;
    caption.appendChild(badge);

    const photoEntriesForCaption = list.filter(entry => entry.dataUrl);
    if(photoEntriesForCaption.length > 0){
      const lines = document.createElement('div');
      lines.className = 'quad-lines';
      photoEntriesForCaption.forEach(entry => {
        const noteEl = document.createElement('span');
        noteEl.className = 'q-note';
        noteEl.contentEditable = 'true';
        noteEl.setAttribute('data-placeholder', '메모 추가');
        noteEl.textContent = entry.note;
        noteEl.addEventListener('input', (ev) => updateNote(slot.id, entry.id, ev.target.textContent));
        lines.appendChild(noteEl);
      });
      caption.appendChild(lines);
    }

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'quad-remove';
    removeBtn.title = '이 칸 전체 삭제';
    removeBtn.textContent = '삭제';
    removeBtn.addEventListener('click', () => removeSlot(slot.id));
    caption.appendChild(removeBtn);

    section.appendChild(caption);

    container.appendChild(section);
  });

  document.getElementById('totalCount').textContent = total;
  renderSlotChips();
  equalizeCaptionHeights(totalRows);
  renderMergedView();
}

function renderMergedView(){
  const view = document.getElementById('mergedView');
  view.innerHTML = '';

  const allEntries = [];
  slots.forEach(slot => {
    const meal = mealDef(slot.key);
    (entriesBySlot[slot.id] || []).forEach(entry => {
      allEntries.push({ entry, meal });
    });
  });
  allEntries.sort((a, b) => a.entry.time.localeCompare(b.entry.time));

  if(allEntries.length === 0){
    const empty = document.createElement('div');
    empty.className = 'merged-empty';
    empty.textContent = '기록 없음';
    view.appendChild(empty);
    return;
  }

  allEntries.forEach(({ entry, meal }) => {
    const item = document.createElement('div');
    item.className = 'merged-item';

    const photoBox = document.createElement('div');
    photoBox.className = 'merged-photo';

    if(entry.dataUrl){
      const img = document.createElement('img');
      img.src = entry.dataUrl;
      img.alt = meal.label + ' 사진';
      img.style.transform = `rotate(${entry.rotation || 0}deg)`;
      img.style.objectPosition = `${entry.cropX ?? 50}% ${entry.cropY ?? 50}%`;
      photoBox.appendChild(img);

      const timeTag = document.createElement('span');
      timeTag.className = 'photo-time';
      timeTag.textContent = entry.time;
      photoBox.appendChild(timeTag);
    } else {
      photoBox.classList.add('merged-photo-text');
      const txt = document.createElement('span');
      txt.className = 'merged-photo-note';
      txt.textContent = entry.note || '';
      photoBox.appendChild(txt);
    }
    item.appendChild(photoBox);

    const caption = document.createElement('div');
    caption.className = 'merged-caption';
    const badge = document.createElement('span');
    badge.className = 'quad-badge';
    badge.textContent = meal.label;
    caption.appendChild(badge);
    if(entry.dataUrl && entry.note){
      const noteEl = document.createElement('span');
      noteEl.className = 'merged-note';
      noteEl.textContent = entry.note;
      caption.appendChild(noteEl);
    }
    item.appendChild(caption);

    view.appendChild(item);
  });
}

function equalizeCaptionHeights(totalRows){
  const container = document.getElementById('mealSections');
  const captions = container.querySelectorAll('.quad-caption');
  requestAnimationFrame(() => {
    for(let r = 0; r < totalRows; r++){
      const rowCaptions = [captions[r * 2], captions[r * 2 + 1]].filter(Boolean);
      if(rowCaptions.length < 2) continue;
      rowCaptions.forEach(c => { c.style.minHeight = ''; });
      const maxH = Math.max(...rowCaptions.map(c => c.offsetHeight));
      rowCaptions.forEach(c => { c.style.minHeight = maxH + 'px'; });
    }
  });
}

function renderSlotChips(){
  const chipRow = document.getElementById('slotChips');
  chipRow.innerHTML = '';
  MEALS.forEach(meal => {
    const exists = slots.some(s => s.key === meal.key);
    if(exists && !meal.repeatable) return;
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'slot-chip';
    chip.textContent = `+ ${meal.name}`;
    chip.addEventListener('click', () => addSlot(meal.key));
    chipRow.appendChild(chip);
  });
  if(!waterEnabled){
    const waterChip = document.createElement('button');
    waterChip.type = 'button';
    waterChip.className = 'slot-chip';
    waterChip.textContent = '+ 물';
    waterChip.addEventListener('click', () => setWaterEnabled(true));
    chipRow.appendChild(waterChip);
  }
}

async function exportImage(){
  const wasPreview = document.body.classList.contains('preview-mode');
  setMode('preview');
  const btn = document.getElementById('saveBtn');
  const original = btn.textContent;
  btn.textContent = '저장 중...';
  btn.disabled = true;
  try{
    const target = document.getElementById('report');
    const canvas = await html2canvas(target, {
      backgroundColor: getComputedStyle(document.body).backgroundColor,
      scale: 2,
      useCORS: true,
    });
    const link = document.createElement('a');
    const dateVal = currentDateStr || 'meal-log';
    link.download = `식단_${dateVal}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(err){
    alert('이미지 저장에 실패했어요: ' + err.message);
  }finally{
    btn.textContent = original;
    btn.disabled = false;
    if(!wasPreview) setMode('edit');
  }
}

let pendingSlotId = null;

function openAddChoiceSheet(slotId){
  pendingSlotId = slotId;
  document.getElementById('addChoiceSheet').style.display = 'flex';
}
function closeAddChoiceSheet(){
  document.getElementById('addChoiceSheet').style.display = 'none';
}
function chooseTextOnly(){
  const slotId = pendingSlotId;
  closeAddChoiceSheet();
  const entry = { id: ++idCounter, dataUrl: null, time: nowTimeStr(), note: '' };
  entriesBySlot[slotId].push(entry);
  render();
  saveCurrentDay();
  requestAnimationFrame(() => {
    const el = document.querySelector(`[data-entry-id="${entry.id}"] .text-cell-note`);
    if(el) el.focus();
  });
}
function choosePhotoFlow(){
  const slotId = pendingSlotId;
  closeAddChoiceSheet();
  openPhotoSheet(slotId);
}

function openPhotoSheet(slotId){
  pendingSlotId = slotId;
  document.getElementById('photoSheet').style.display = 'flex';
}
function closePhotoSheet(){
  document.getElementById('photoSheet').style.display = 'none';
}
function triggerCamera(){ document.getElementById('cameraInput').click(); }
function triggerGallery(){ document.getElementById('galleryInput').click(); }

let pendingTimeSlotId = null, pendingTimeEntryId = null, tempHour = 0, tempMinute = 0;

function openTimePicker(slotId, entryId, currentTime){
  pendingTimeSlotId = slotId;
  pendingTimeEntryId = entryId;
  const [h, m] = currentTime.split(':').map(Number);
  tempHour = h; tempMinute = m;
  updateTimeStepperUI();
  document.getElementById('timeSheet').style.display = 'flex';
}
function closeTimePicker(){
  document.getElementById('timeSheet').style.display = 'none';
}
function adjustHour(delta){
  tempHour = (tempHour + delta + 24) % 24;
  updateTimeStepperUI();
}
function adjustMinute(delta){
  tempMinute = (tempMinute + delta + 60) % 60;
  updateTimeStepperUI();
}
function updateTimeStepperUI(){
  document.getElementById('hourValue').textContent = pad(tempHour);
  document.getElementById('minuteValue').textContent = pad(tempMinute);
}
function confirmTimePicker(){
  const val = pad(tempHour) + ':' + pad(tempMinute);
  updateTime(pendingTimeSlotId, pendingTimeEntryId, val);
  closeTimePicker();
  render();
}

document.getElementById('cameraInput').addEventListener('change', (ev) => {
  if(pendingSlotId) handleFiles(pendingSlotId, ev.target.files);
  ev.target.value = '';
  closePhotoSheet();
});
document.getElementById('galleryInput').addEventListener('change', (ev) => {
  if(pendingSlotId) handleFiles(pendingSlotId, ev.target.files);
  ev.target.value = '';
  closePhotoSheet();
});

initDate();
render();
document.getElementById('dailyNote').addEventListener('input', saveCurrentDay);

document.body.dataset.layout = tileLayout;
document.querySelectorAll('.layout-chip').forEach(btn => {
  btn.addEventListener('click', () => setLayout(btn.dataset.layout));
});
updateLayoutChipsUI();
applyWaterVisibility();
